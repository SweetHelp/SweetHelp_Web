<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ArSweetCards | Sweet Help</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Lilita+One&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
@font-face{font-family:"Choco Taste Trial";src:url("Choco Taste Trial.otf") format("opentype"),url("Choco%20Taste%20Trial.otf") format("opentype");font-display:swap}
:root{--rosa:#f28f95;--crema:#f8f2dc;--marron:#8b5e3c;--oscuro:#2a1408;--antojo:#8a3f55;--agregar:#e0527a;
  --titulo:"Choco Taste Trial","Lobster",cursive;--cuerpo:"Lilita One",system-ui,sans-serif;
  --pw:min(47vw,56vh);--ph:calc(var(--pw)*1.437)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--cuerpo);background:#fff}
button{font-family:var(--cuerpo);cursor:pointer;border:0}
[hidden]{display:none!important}

/* ---------- AR ---------- */
#ar{position:fixed;inset:0;z-index:0;overflow:hidden;background:transparent}
#ar video{position:absolute!important;z-index:0!important;display:block!important;max-width:none!important}
#ar a-scene{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
#ar canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
.arbar{position:fixed;top:12px;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:1rem;color:#fff;background:rgba(42,20,8,.6);backdrop-filter:blur(6px);padding:9px 16px;border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill img.ic{height:1.4em;width:auto;display:block}
.pill.rosa{background:var(--agregar)}
.pill.ibtn{background:none;backdrop-filter:none;padding:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));transition:transform .2s}
.ibtn img{height:54px;width:auto;display:block}.ibtn:active{transform:scale(.92)}
.guia{position:fixed;left:0;right:0;top:50%;z-index:20;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .35s}
.guia.on{opacity:1}
.marco{width:min(62vw,260px);aspect-ratio:3/4;position:relative}
.marco i{position:absolute;width:34px;height:34px;border:5px solid #fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:late 1.6s ease-in-out infinite}
.marco i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.marco i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.marco i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.marco i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
@keyframes late{50%{transform:scale(1.12)}}
.guia span{color:#fff;background:rgba(42,20,8,.6);padding:7px 16px;border-radius:999px}
.pant{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(42,20,8,.85);color:#fff}
.rueda{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.btn{font-size:1.2rem;color:#fff;background:var(--agregar);border-radius:999px;padding:11px 30px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;top:70px;z-index:95;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--agregar);color:#fff;padding:9px 20px;border-radius:999px;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- ÁLBUM ---------- */
.alb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:#fff}
.top{flex:none;width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.top a{color:#fff;text-decoration:none;background:rgba(42,20,8,.55);padding:8px 16px;border-radius:999px}
.top h1{margin:0;font-family:var(--titulo);font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--marron)}
.escena{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.vp{position:relative;width:calc(var(--pw)*2);height:var(--ph)}
.mesa{position:absolute;left:0;top:0;width:calc(var(--pw)*2);height:100%;perspective:2600px;perspective-origin:50% 40%;transition:transform 1.1s cubic-bezier(.45,.05,.25,1),perspective-origin 1.1s cubic-bezier(.45,.05,.25,1)}
@media (max-width:760px) and (orientation:portrait){:root{--pw:min(88vw,52vh)}.vp{width:var(--pw);clip-path:inset(-12% 0 -12% 0)}}
.libro{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.25,1)}
.suelo{position:absolute;left:2%;right:2%;bottom:-3%;height:8%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(6px);transform:translateZ(-6px)}
.borde{position:absolute;top:0;height:100%;width:calc(var(--pw)*.1);z-index:50;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:pulsa 2s ease-in-out infinite}
.borde.d{right:0;background:linear-gradient(270deg,rgba(255,255,255,.35),transparent);border-radius:0 16px 16px 0}
.borde.i{left:0;background:linear-gradient(90deg,rgba(255,255,255,.35),transparent);border-radius:16px 0 0 16px}
@keyframes pulsa{50%{opacity:.35}}
.scan{background:none;padding:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));transition:transform .2s}
.scan img{height:68px;width:auto;display:block}.scan:active{transform:scale(.92)}
.base{position:absolute;right:0;top:0;width:50%;height:100%;border-radius:4px 16px 16px 4px;background:#d9879a url("contraportadalibro.svg") center/100% 100% no-repeat}
.leaf{position:absolute;right:0;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.25,1)}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face::after{content:"";position:absolute;inset:0;background:#2a1408;opacity:0;pointer-events:none}
.leaf.mov .face::after{animation:sombra .95s ease-in-out}
@keyframes sombra{50%{opacity:.3}}
.fr{inset:0}.bk{inset:0;transform:rotateY(180deg)}
.cov{border-radius:4px 16px 16px 4px;background:var(--rosa) url("portadalibro.svg") center/100% 100% no-repeat}
.cov2{border-radius:16px 4px 4px 16px;background:linear-gradient(270deg,#c8707f,#e58a92 20%)}
.pg{background:linear-gradient(#fbf6e6,#f1e9cb)}
.pg.fr{inset:1.5% 2.5% 1.5% 0;border-radius:2px 8px 8px 2px;background-image:linear-gradient(90deg,rgba(60,30,10,.35),transparent 10%),linear-gradient(#fbf6e6,#f1e9cb)}
.pg.bk{inset:1.5% 0 1.5% 2.5%;border-radius:8px 2px 2px 8px;background-image:linear-gradient(270deg,rgba(60,30,10,.35),transparent 10%),linear-gradient(#fbf6e6,#f1e9cb)}
.grid{position:absolute;inset:4.5% 7% 6%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3.5%}
.pn{position:absolute;bottom:1.6%;left:0;right:0;text-align:center;font-style:normal;font-size:.65rem;color:var(--marron);opacity:.7}
.slot{position:relative;padding:0;border-radius:6%;overflow:hidden;background:rgba(138,63,85,.1);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),inset 0 0 10px rgba(60,30,10,.25),0 1px 2px rgba(0,0,0,.25)}
.slot.vacio{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),inset 0 0 10px rgba(60,30,10,.12);background:rgba(138,63,85,.05)}
.slot img{width:100%;height:100%;object-fit:contain;display:block}
.celda{display:flex;flex-direction:column;gap:2%;min-width:0;min-height:0}
.celda .slot{flex:1;min-height:0}
.num{flex:none;text-align:center;line-height:1;padding-top:2%;font-size:max(.6rem,calc(var(--pw)*.045));color:#843D4B}
.slot.on::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.4),transparent 35%)}
.slot:not(.on):not(.vacio) img{animation:tiembla 6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 60%}
@keyframes tiembla{0%,84%,100%{transform:none}86%{transform:rotate(-5deg) translateX(-2px)}88%{transform:rotate(5deg) translateX(2px)}90%{transform:rotate(-4deg)}92%{transform:rotate(3deg)}94%{transform:rotate(-1.5deg)}96%{transform:none}}
@media (prefers-reduced-motion:reduce){.slot img{animation:none!important}}
.slot.nueva{animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* brilli brilli para las cartas especiales */
.esp{position:relative}
.esp::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;mix-blend-mode:color-dodge;background-size:260% 100%;
  background-image:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.7) 42%,rgba(255,120,220,.45) 50%,rgba(110,230,255,.5) 58%,transparent 75%);animation:brilla 2.6s linear infinite}
.esp::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  background:radial-gradient(circle at 18% 22%,#fff 0 1.5px,transparent 4px),radial-gradient(circle at 78% 35%,#fff 0 2px,transparent 5px),radial-gradient(circle at 40% 72%,#fff 0 1.5px,transparent 4px),radial-gradient(circle at 85% 84%,#fff 0 2px,transparent 5px);animation:chispa 1.5s ease-in-out infinite}
@keyframes brilla{from{background-position:130% 0}to{background-position:-30% 0}}
@keyframes chispa{0%,100%{opacity:.1;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.hint{position:absolute;bottom:92px;left:0;right:0;text-align:center;color:var(--antojo);font-size:1.1rem;animation:flota 2s ease-in-out infinite;pointer-events:none}
@keyframes flota{50%{transform:translateY(-8px)}}
.barra{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px 16px;width:100%}
.nav{width:46px;height:46px;border-radius:50%;background:rgba(42,20,8,.6);color:#fff;font-size:1.7rem;line-height:1}
.nav:disabled{opacity:.3}
.barra .btn{padding:11px 22px}
.demo{position:fixed;right:10px;bottom:84px;z-index:65;display:flex;gap:6px}
.demo button{padding:6px 12px;border-radius:999px;background:var(--crema);color:var(--marron)}

/* ---------- Carta 3D (desbloqueo y visor) ---------- */
.c3d{position:relative;width:min(62vw,300px);aspect-ratio:185/284;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,1.2,.4,1)}
.c3d.vuelta{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cf img{width:100%;height:100%;display:block;object-fit:contain}
.cfr{transform:rotateY(180deg)}
.desb,.vis{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;perspective:1400px;background:rgba(42,20,8,.88);overflow:hidden;color:#fff;text-align:center}
.vis{z-index:80;background:rgba(255,255,255,.97);color:var(--marron)}
.vis .c3d{width:min(70vw,calc(50vh*.651),360px)}
.vnum{font-family:var(--cuerpo);color:#843D4B}
.vtip{color:var(--antojo);font-size:.85rem}
.vnom{margin:0;font-family:var(--titulo);font-size:clamp(1.6rem,6vw,2.2rem);color:var(--marron)}
.vdesc{margin:0;max-width:min(92vw,420px);background:var(--crema);border:5px solid var(--rosa);border-radius:22px;padding:10px 16px;font-size:1rem;line-height:1.3;color:var(--oscuro)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.desb.bum .flash{animation:flash2 .9s ease-out}
@keyframes flash2{0%{opacity:1}100%{opacity:0}}
.onda{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:6px solid #fff;opacity:0;pointer-events:none}
.desb.bum .onda{animation:onda 1s ease-out}
@keyframes onda{0%{transform:scale(1);opacity:.95}100%{transform:scale(70);opacity:0}}
.desb .rayos{opacity:0;transition:opacity .8s}.desb.bum .rayos{opacity:.5}
.desb.bum .dt{animation:pop2 .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{0%{transform:scale(.6)}100%{transform:scale(1)}}
.lockfx .cf{animation:lockGlow 1.9s ease-in-out forwards}
@keyframes lockGlow{0%{filter:brightness(1) drop-shadow(0 0 0 rgba(255,225,130,0))}
 40%{filter:brightness(1.3) drop-shadow(0 0 26px rgba(255,225,130,.95))}
 70%{filter:brightness(1.6) drop-shadow(0 0 44px rgba(255,235,160,1));transform:scale(1.03)}
 78%{transform:scale(1.03) rotate(-3deg)}84%{transform:scale(1.03) rotate(3deg)}90%{transform:scale(1.03) rotate(-2deg)}
 100%{filter:brightness(2) drop-shadow(0 0 60px #fff);transform:scale(1.06)}}
.revela{animation:boom .85s cubic-bezier(.2,1.4,.4,1)}
@keyframes boom{0%{transform:scale(.15) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.rayos{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;opacity:.5;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,215,230,.5) 0 8deg,transparent 8deg 24deg);animation:gira 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.desb>*:not(.flash):not(.rayos):not(.onda){position:relative;z-index:2}
.dt{margin:0;font-family:var(--titulo);font-size:clamp(2rem,8vw,3rem);color:#ffe0e8;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.dn{margin:0;font-size:1.2rem}
.dbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.sec{background:#fff;color:var(--agregar)}
</style>
</head>
<body>

<div id="ar">
  <a-scene id="escenaAr" embedded background="transparent: true"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; warmupTolerance: 3; missTolerance: 12;"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
    <a-light type="ambient" color="#ffffff" intensity="1.1"></a-light>
  </a-scene>
</div>

<div class="arbar" id="arbar" hidden>
  <button class="pill ibtn" id="btnAlbum" type="button" aria-label="Álbum"><img src="album.svg" alt="Álbum"></button>
  <span class="pill" id="contAr"></span>
</div>
<div class="guia" id="guia"><div class="marco"><i></i><i></i><i></i><i></i></div><span>Apunta a una carta Sweet Help</span></div>

<!-- ÁLBUM = menú -->
<section class="alb" id="alb">
  <div class="top"><a href="productos.html">&#8592; Volver</a><h1>ArSweetCards</h1><span class="pill" id="cont"></span></div>
  <div class="escena" id="escena">
    <div class="vp"><div class="mesa" id="mesa"><div class="libro" id="libro"><div class="suelo"></div><div class="base"></div></div></div>
      <button class="borde i" id="bI" type="button" aria-label="Página anterior" hidden>&#8249;</button><button class="borde d" id="bD" type="button" aria-label="Página siguiente" hidden>&#8250;</button></div>
  </div>
  <div class="hint" id="hint">Toca la tapa para acercar y abrir el álbum</div>
  <div class="barra">
    <button class="scan" id="btnScan" type="button" aria-label="Scan"><img src="Scan.svg" alt="Scan"></button>
  </div>
  <div class="demo" id="demo" hidden><button id="dSim">🎲 Simular</button><button id="dRes">↺ Reiniciar</button></div>
</section>

<!-- Desbloqueo -->
<section class="desb" id="desb" hidden>
  <div class="flash"></div><div class="onda"></div><div class="rayos"></div>
  <p class="dt" id="dTit"></p>
  <div id="dCarta"></div>
  <p class="dn" id="dNom"></p>
  <div class="dbtns" id="dBtns" hidden><button class="btn sec" id="dSeguir">Seguir cazando</button><button class="btn" id="dVer">Ver en el álbum</button></div>
</section>
<section class="vis" id="vis" hidden>
  <div id="vCarta"></div><p class="vnom" id="vNom"></p><p class="vdesc" id="vDesc"></p><small class="vtip" id="vTip">Arrastra o toca la carta para girarla</small>
  <button class="btn" id="vX">Cerrar</button>
</section>

<section class="pant" id="pCarga" hidden><div class="rueda"></div><p>Preparando la cámara…</p></section>
<section class="pant" id="pError" hidden><h2 style="font-family:var(--titulo);font-weight:400;font-size:2.4rem;margin:0">¡Ups!</h2><p id="errorTexto" style="max-width:340px"></p><button class="btn" id="btnReint">Intentar de nuevo</button><button class="btn sec" id="btnErrAlb">Volver al álbum</button></section>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ARSWEETCARDS — CAZA DE CARTAS
   - El orden de CARTAS = el orden de las imágenes del .mind (00.png = índice 0, etc.).
   - num      = número de la carta (su lugar en el álbum, 1 a 22).
   - especial = true -> carta con brilli brilli.
   - Imagen de la carta (álbum / desbloqueo):  cartas/NN.png   (NN = posición en el .mind)
   - Imagen que flota en AR:                   prearcard/NN.png (NN = número de la carta)
   Imágenes del libro: portadalibro.svg, contraportadalibro.svg, cardblock.svg, cartasatras.svg
   ===================================================================== */
const AR_DIR = "prearcard/", CARTAS_DIR = "cartas/";
const PI = "Ingredientes: leche entera, leche condensada, crema de leche, bizcocho de ";
const DATOS = [
  /* num, nombre, especial (true = brilli brilli), descripción (se ve al tocar la carta en el álbum) */
  [22,"Sneake Merenguita",false,"Carta de la colección Sweet Help."],
  [21,"Sneake Mandarina",false,"Carta de la colección Sweet Help."],
  [20,"Sneake Frambuesa",false,"Carta de la colección Sweet Help."],
  [19,"Choco Fresh",false,"Carta de la colección Sweet Help."],
  [6,"Choco Mix",false,PI + "mixto, Milo."],
  [5,"Choco Fresa",false,PI + "chocolate, mermelada de fresa."],
  [4,"Choco Milo",false,PI + "chocolate, Milo."],
  [3,"Fresa Tentación",false,PI + "vainilla, mermelada de fresa."],
  [2,"Mora Silvestre",false,PI + "vainilla, mermelada de mora."],
  [18,"Postre",false,"La estrella de Sweet Help: el postre tres leches."],
  [17,"Kit",false,"Con cada compra, parte del dinero se destina a un kit alimenticio."],
  [16,"Pinky Arroz",false,"Pinky se disfraza de arroz para ayudar contra el hambre."],
  [15,"Punto de Venta",false,"Aquí se venden los postres de Sweet Help."],
  [14,"Pinky Repostera",false,"Pinky prepara los postres que ayudan a combatir el hambre."],
  [13,"Pinky Repartidora",false,"Pinky lleva la ayuda en moto hasta quien la necesita."],
  [1,"Maracuyá Tropical",false,PI + "vainilla, pulpa de maracuyá."],
  [7,"Pinky Lisa",true,"Pinky se inspira en La Mona Lisa."],
  [8,"Pinky Grito",true,"Pinky se inspira en El grito, de Munch."],
  [9,"Pinky Noche",true,"Pinky se inspira en La noche estrellada, de Van Gogh."],
  [10,"Pinky Creación",true,"Pinky se inspira en La creación de Adán."],
  [11,"Pinky Vitruvio",true,"Pinky se inspira en el Hombre de Vitruvio."],
  [12,"Pinky Chambeadora",false,"Pinky se pone a trabajar por quienes más lo necesitan."]
];
const p2 = n => String(n).padStart(2, "0");
const CARTAS = DATOS.map(([num, nombre, especial, desc], i) => ({ i, num, nombre, desc, esp: !!especial, carta: CARTAS_DIR + p2(i) + ".png", ar: AR_DIR + p2(num) + ".png" }));
const POR_NUM = {}; CARTAS.forEach(c => POR_NUM[c.num] = c);
const TOTAL = CARTAS.length, PAGS = Math.ceil(TOTAL / 4);   // 4 cartas por página

const $ = id => document.getElementById(id);
const demo = new URLSearchParams(location.search).get("demo") === "1";
const KEY = "arsweetcards_album";
let got = new Set();
try { got = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify([...got])); } catch (e) {} };
const SONIDO_PAGINA = "";      // opcional: ruta de tu propio sonido (mp3/ogg). Vacío = sonido de hoja generado por el navegador
let ac;
function sonidoPagina(){
  try{
    if(SONIDO_PAGINA){ const a = new Audio(SONIDO_PAGINA); a.play().catch(() => {}); return; }
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const ruido = (dur, curva) => { const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, curva);
      const s = ac.createBufferSource(); s.buffer = b; return s; };
    const t = ac.currentTime;
    const s1 = ruido(.55, 1.4), bp = ac.createBiquadFilter(), g1 = ac.createGain();            // "shhhh" de la hoja al girar
    bp.type = "bandpass"; bp.Q.value = .8; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(5200, t + .45);
    g1.gain.setValueAtTime(0, t); g1.gain.linearRampToValueAtTime(.5, t + .07); g1.gain.exponentialRampToValueAtTime(.001, t + .55);
    s1.connect(bp); bp.connect(g1); g1.connect(ac.destination); s1.start(t);
    const s2 = ruido(.14, 2), lp = ac.createBiquadFilter(), g2 = ac.createGain();               // golpecito suave al caer
    lp.type = "lowpass"; lp.frequency.value = 600; g2.gain.value = .35;
    s2.connect(lp); lp.connect(g2); g2.connect(ac.destination); s2.start(t + .72);
  }catch(e){}
}
function audio(){ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if(ac.state === "suspended") ac.resume(); return ac; }
function tono(f0, t, dur, vol, tipo, f1){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = tipo || "sine"; o.frequency.setValueAtTime(f0, t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
function sonidoBrillo(){ try{ audio(); const t = ac.currentTime;                        // chispitas que suben mientras brilla el candado
  for(let k = 0; k < 8; k++) tono(880 * Math.pow(1.19, k), t + k * .22, .35, .09, "triangle"); }catch(e){} }
function sonidoBum(){ try{ audio(); const t = ac.currentTime;
  tono(150, t, .6, .9, "sine", 35);                                                       // el "bum"
  const n = Math.floor(ac.sampleRate * .4), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; lp.type = "lowpass"; lp.frequency.value = 900; g.gain.value = .5;
  s.connect(lp); lp.connect(g); g.connect(ac.destination); s.start(t);
  [1047, 1319, 1568, 2093].forEach((fq, k) => tono(fq, t + .18 + k * .09, .5, .14, "triangle"));   // campanitas
}catch(e){} }
let tToast;
function avisar(t){ const x = $("toast"); x.textContent = t; x.classList.add("show"); clearTimeout(tToast); tToast = setTimeout(() => x.classList.remove("show"), 1900); }

/* ---------- Libro ---------- */
const libro = $("libro"), mesa = $("mesa");
function pagina(p){
  let h = '<div class="grid">';
  for(let s = p * 4 + 1; s <= p * 4 + 4; s++){
    const c = POR_NUM[s];
    h += c ? `<div class="celda"><button class="slot" data-i="${c.i}" type="button" style="--d:-${(Math.random() * 6).toFixed(1)}s"></button><span class="num">#${p2(c.num)}</span></div>`
             : '<div class="celda"><div class="slot vacio"></div></div>';
  }
  return h + `</div><i class="pn">${p + 1}</i>`;
}
let leaves = '<div class="leaf"><div class="face fr cov"></div><div class="face bk cov2"></div></div>';   // tapa
for(let j = 0; j < Math.ceil(PAGS / 2); j++)
  leaves += `<div class="leaf"><div class="face fr pg">${pagina(j * 2)}</div><div class="face bk pg">${pagina(j * 2 + 1)}</div></div>`;
libro.insertAdjacentHTML("beforeend", leaves);
const hojas = [...libro.querySelectorAll(".leaf")], NH = hojas.length;

function pintaSlot(c, nueva){
  libro.querySelectorAll(`[data-i="${c.i}"]`).forEach(s => {
    const on = got.has(c.i);
    s.innerHTML = on ? `<img src="${c.carta}" alt="${c.nombre}" draggable="false">`
                     : `<img src="cardblock.svg" alt="Carta bloqueada" draggable="false">`;
    s.classList.toggle("on", on); s.classList.toggle("esp", on && c.esp);
    if(nueva){ s.classList.remove("nueva"); void s.offsetWidth; s.classList.add("nueva"); }
  });
}
function contadores(){ const t = '<img class="ic" src="cartasicono2.svg" alt="Cartas"> ' + got.size + " / " + TOTAL; $("cont").innerHTML = t; $("contAr").innerHTML = t; }
CARTAS.forEach(c => pintaSlot(c)); contadores();

let f = 0, lado = "R";      // f = hojas ya pasadas (0 = cerrado); lado = página visible en teléfono (R derecha / L izquierda)
const mq = matchMedia("(max-width:760px) and (orientation:portrait)"), movil = () => mq.matches;
function pintaLibro(){
  hojas.forEach((l, k) => {
    const v = k < f;
    if(l._v !== undefined && l._v !== v){ l.classList.add("mov"); setTimeout(() => l.classList.remove("mov"), 980); }
    l._v = v;
    l.style.transform = `translateZ(${v ? (k + 1) * 2 : (NH - k) * 2}px) rotateY(${v ? -180 : 0}deg)`;
  });
  // cerrado = lejos y en la mesa; al tocar la tapa se acerca y se abre
  const m = movil(), k = m ? .7 : .55, der = !m || lado === "R";
  libro.style.transform = f === 0 ? `translateX(${m ? 25 - 25 * k : -25 * k}%) scale(${k}) rotateX(22deg)` : "translateX(0) scale(1) rotateX(6deg)";
  mesa.style.transform = m ? `translateX(${der ? -50 : 0}%)` : "none";                 // en teléfono solo se ve una mitad del libro
  mesa.style.perspectiveOrigin = m ? (der ? "75% 40%" : "25% 40%") : "50% 40%";
  $("bI").hidden = f === 0; $("bD").hidden = f === 0 || (m ? (f >= NH && lado === "L") : f >= NH);
  $("hint").hidden = f !== 0;
}
const ir = d => {
  const f0 = f, l0 = lado;
  if(!movil()) f = Math.max(0, Math.min(NH, f + d));
  else if(d > 0){ if(f === 0){ f = 1; lado = "R"; } else if(lado === "R"){ if(f < NH){ f++; lado = "L"; } } else if(f < NH) lado = "R"; }
  else if(f > 0){ if(lado === "R"){ if(f === 1) f = 0; else lado = "L"; } else { f--; lado = "R"; } }
  if(f !== f0 || lado !== l0) sonidoPagina();
  pintaLibro();
};
(mq.addEventListener ? mq.addEventListener("change", () => pintaLibro()) : mq.addListener(() => pintaLibro()));
$("bI").onclick = e => { e.stopPropagation(); ir(-1); };
$("bD").onclick = e => { e.stopPropagation(); ir(1); };   // las páginas solo se pasan tocando el borde

let x0 = 0, arrastro = false;
$("escena").addEventListener("pointerdown", e => { x0 = e.clientX; arrastro = false; });
$("escena").addEventListener("pointerup", e => {                                   // en teléfono también se pasa deslizando el dedo
  const dx = e.clientX - x0;
  if(movil() && Math.abs(dx) > 50){ arrastro = true; ir(dx < 0 ? 1 : -1); }
});
$("escena").addEventListener("click", e => {
  if(arrastro){ arrastro = false; return; }
  if(f === 0){ ir(1); return; }                                  // la tapa es el menú: tócala para abrir
  const s = e.target.closest(".slot[data-i]"); if(!s) return;
  const c = CARTAS[+s.dataset.i];
  abrirVisor(c);
});
function irACarta(c){
  const p = Math.floor((c.num - 1) / 4);
  if(movil()){ const s = p + 1; if(s % 2){ f = (s + 1) / 2; lado = "R"; } else { f = s / 2 + 1; lado = "L"; } }
  else f = Math.floor(p / 2) + 1 + (p % 2);
  pintaLibro();
}

/* ---------- Carta 3D (desbloqueo y visor) ---------- */
const carta3d = (c, bloq) => `<div class="c3d"><div class="cf"><img src="cartasatras.svg" alt="Reverso"></div>` +
  `<div class="cf cfr ${c.esp && !bloq ? "esp" : ""}"><img src="${bloq ? "cardblock.svg" : c.carta}" alt="${c.nombre}"></div></div>`;
let ultima = null;
let tDesb = [];
function desbloquear(c){
  got.add(c.i); guardar(); pintaSlot(c, true); contadores(); ultima = c;
  const D = $("desb"); tDesb.forEach(clearTimeout); tDesb = [];
  D.className = "desb"; D.hidden = false;
  $("dTit").textContent = "¡Carta encontrada!"; $("dNom").textContent = ""; $("dBtns").hidden = true;
  $("dCarta").innerHTML = '<div class="c3d lockfx"><div class="cf esp"><img src="cardblock.svg" alt="Carta bloqueada"></div></div>';   // 1) brilla el candado
  sonidoBrillo();
  tDesb.push(setTimeout(() => {                                                                                                      // 2) ¡bum! aparece la carta
    D.classList.add("bum"); sonidoBum();
    $("dTit").textContent = "¡Carta desbloqueada!";
    $("dCarta").innerHTML = `<div class="c3d revela"><div class="cf ${c.esp ? "esp" : ""}"><img src="${c.carta}" alt="${c.nombre}"></div></div>`;
    $("dNom").textContent = "#" + p2(c.num) + " · " + c.nombre + (c.esp ? " ✨" : "");
    $("dBtns").hidden = false;
    if(navigator.vibrate) try{ navigator.vibrate([60, 40, 120]); }catch(e){}
  }, 1900));
}
$("dSeguir").onclick = () => { $("desb").hidden = true; };
$("dVer").onclick = () => { $("desb").hidden = true; irAlbum(ultima); };
function abrirVisor(c){
  const on = got.has(c.i);
  $("vCarta").innerHTML = carta3d(c, !on);
  const k = $("vCarta").firstChild;
  let ang = 0, tilt = 0;
  const pon = () => { k.style.transform = `rotateX(${tilt}deg) rotateY(${ang}deg)`; };
  k.style.touchAction = "none"; k.style.cursor = "grab";
  let x0, y0, a0, mov = false, drag = false;
  k.onpointerdown = e => { drag = true; mov = false; x0 = e.clientX; y0 = e.clientY; a0 = ang; k.style.transition = "none"; k.setPointerCapture(e.pointerId); };
  k.onpointermove = e => { if(!drag) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) + Math.abs(dy) > 6) mov = true;
    ang = a0 + dx * .7; tilt = Math.max(-25, Math.min(25, -dy * .25)); pon(); };
  const suelta = () => { if(!drag) return; drag = false; k.style.transition = "";
    ang = mov ? Math.round(ang / 180) * 180 : a0 + 180;      // soltar = de frente o de espalda; un toque la voltea
    tilt = 0; pon(); };
  k.onpointerup = suelta; k.onpointercancel = suelta;
  setTimeout(() => { ang = 180; pon(); }, 30);
  $("vTip").hidden = false;
  $("vNom").innerHTML = '<span class="vnum">#' + p2(c.num) + '</span> · ' + c.nombre + (on && c.esp ? " ✨" : "");
  $("vDesc").textContent = on ? c.desc : "🔒 Escanea esta carta con la cámara para desbloquearla.";
  $("vis").hidden = false;
}
$("vX").onclick = () => { $("vis").hidden = true; };

/* ---------- AR: imagen flotante sobre cada carta ---------- */
/* Pide a la cámara más resolución y enfoque continuo: con dibujos planos, a 640x480 la carta casi no se reconoce */
(function(){
  const md = navigator.mediaDevices; if(!md || !md.getUserMedia) return;
  const gum = md.getUserMedia.bind(md);
  md.getUserMedia = function(c){
    if(c && c.video){
      const v = typeof c.video === "object" ? c.video : {};
      c = Object.assign({}, c, { video: Object.assign({}, v, { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: "continuous" }] }) });
    }
    return gum(c).catch(() => gum({ audio: false, video: { facingMode: "environment" } }));   // si el teléfono no acepta, vuelve a lo básico
  };
})();
const escena = $("escenaAr"), sistema = () => escena.systems["mindar-image-system"];
const SOMBRA = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"), g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0, "rgba(0,0,0,.6)"); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0,0,128,128); return c.toDataURL(); })();
const mk = (tag, at) => { const e = document.createElement(tag); for(const k in at) e.setAttribute(k, at[k]); return e; };

function crearAnclas(){
  CARTAS.forEach(c => {
    const ancla = mk("a-entity", { "mindar-image-target": "targetIndex: " + c.i });
    const sombra = mk("a-plane", { width: 1.1, height: 1.6, position: "0.04 -0.05 0.01", material: "shader: flat; transparent: true; src: " + SOMBRA,
      animation__p: "property: scale; from: 1 1 1; to: 0.86 0.86 0.86; dir: alternate; dur: 1700; easing: easeInOutSine; loop: true" });
    const flota = mk("a-entity", { position: "0 0 0.12",
      animation__f: "property: position; from: 0 0 0.1; to: 0 0 0.22; dir: alternate; dur: 1700; easing: easeInOutSine; loop: true" });
    const img = mk("a-plane", { width: 1.1, height: 1.6, scale: "0.01 0.01 0.01",
      animation__in: "property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 800; easing: easeOutElastic; startEvents: aparece",
      animation__sx: "property: rotation; from: -5 -8 -2; to: 5 8 2; dir: alternate; dur: 2300; easing: easeInOutSine; loop: true",
      animation__dx: "property: position; from: -0.03 0 0; to: 0.03 0.02 0; dir: alternate; dur: 2900; easing: easeInOutSine; loop: true" });
    const poner = url => { const im = new Image();
      im.onload = () => { img.setAttribute("height", 1.1 * im.naturalHeight / im.naturalWidth); sombra.setAttribute("height", 1.1 * im.naturalHeight / im.naturalWidth);
        img.setAttribute("material", { shader: "flat", transparent: true, side: "double", src: url }); };
      im.onerror = () => { if(url !== c.carta) poner(c.carta); };           // si falta el prearcard, usa la carta normal
      im.src = url; };
    poner(c.ar);
    flota.appendChild(img); ancla.appendChild(sombra); ancla.appendChild(flota);
    ancla.addEventListener("targetFound", () => { $("guia").classList.remove("on"); img.emit("aparece");
      if(got.has(c.i)) avisar("#" + p2(c.num) + " · " + c.nombre + " ✓ ya la tienes"); else if($("desb").hidden) desbloquear(c); });
    ancla.addEventListener("targetLost", () => { $("guia").classList.add("on"); });
    escena.appendChild(ancla);
  });
}

/* ---------- Cámara ---------- */
let camOn = false, camCargando = false;
const pant = id => { ["pCarga", "pError"].forEach(p => $(p).hidden = p !== id); };
function error(m){ camCargando = false; $("errorTexto").textContent = m; pant("pError"); $("guia").classList.remove("on"); }
function falloCamara(e){
  console.warn(e); const n = e && e.name;
  if(n === "NotAllowedError" || n === "PermissionDeniedError") error("No pudimos usar la cámara. Permite el acceso en el navegador y vuelve a intentarlo.");
  else if(!window.isSecureContext) error("La cámara solo funciona en una página segura (HTTPS).");
  else error("No pudimos iniciar la cámara ni leer las cartas. Revisa que targets.mind tenga las 22 imágenes (00 a 21).");
}
async function arrancar(){
  if(camCargando) return; camCargando = true; pant("pCarga");
  try{
    const res = await fetch("targets.mind", { method: "HEAD" });
    if(!res.ok) throw { name: "MindNoEncontrado", status: res.status };
    const r = sistema().start(); if(r && r.catch) r.catch(falloCamara);
  }catch(e){
    if(e && e.name === "MindNoEncontrado") error("No se encontró targets.mind (error " + e.status + "). Debe estar junto a este HTML.");
    else if(e instanceof TypeError) error("No se pudo leer targets.mind. Usa HTTPS o localhost.");
    else falloCamara(e);
  }
}
function mostrarVideo(){
  const v = document.querySelector("#ar video"); if(!v) return;
  v.setAttribute("playsinline", ""); v.muted = true; if(v.paused) v.play().catch(() => {});
  window.dispatchEvent(new Event("resize"));
}
escena.addEventListener("arReady", () => { camOn = true; camCargando = false; pant(null); $("guia").classList.add("on"); mostrarVideo(); setTimeout(mostrarVideo, 600);
  const v = document.querySelector("#ar video"); if(v) avisar("Cámara " + v.videoWidth + "×" + v.videoHeight); });
escena.addEventListener("arError", e => falloCamara(e && e.detail ? e.detail : e));

function irAR(){
  try{ audio(); }catch(e){}                                  // el sonido se habilita con este toque
  $("alb").hidden = true; $("arbar").hidden = false;
  if(demo) return;
  if(camOn){ try{ sistema().unpause(); }catch(e){} $("guia").classList.add("on"); mostrarVideo(); }
  else arrancar();
}
function irAlbum(c){
  $("alb").hidden = false; $("arbar").hidden = true; $("guia").classList.remove("on"); pant(null);
  try{ if(camOn) sistema().pause(); }catch(e){}
  if(c){ irACarta(c); setTimeout(() => pintaSlot(c, true), 800); }
}
$("btnScan").onclick = irAR;
$("btnAlbum").onclick = () => irAlbum();
$("btnReint").onclick = () => { camCargando = false; try{ sistema().stop(); }catch(e){} arrancar(); };
$("btnErrAlb").onclick = () => { camCargando = false; irAlbum(); };

/* ---------- Inicio ---------- */
pintaLibro();
if(demo){
  $("demo").hidden = false;
  $("dSim").onclick = () => { const c = CARTAS.find(x => !got.has(x.i)); if(!c) return avisar("¡Ya tienes todas!"); $("alb").hidden = true; desbloquear(c); };
  $("dRes").onclick = () => { got.clear(); guardar(); CARTAS.forEach(c => pintaSlot(c)); contadores(); };
  $("dVer").onclick = () => { $("desb").hidden = true; irAlbum(ultima); };
}else{
  const iniciar = () => crearAnclas();
  escena.hasLoaded ? iniciar() : escena.addEventListener("loaded", iniciar);
}
</script>
