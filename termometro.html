    <section class="termometro-section">
        <div class="termometro-main-container" id="termometroMain">
            <div class="termometro-wrapper">
                <div class="termometro-scale">
                    <span>- 500</span>
                    <span>- 375</span>
                    <span>- 250</span>
                    <span>- 125</span>
                    <span>- 0</span>
                </div>
                <div class="termometro-tube">
                    <div class="termometro-mercury" id="mercuryElement"></div>
                </div>
                <div class="termometro-bulb">
                    <div class="termometro-kits-label" id="kitsLabelElement" style="color:#864f02; text-align:center; font-weight:800;">???</div>
                </div>
            </div>
            <button class="termometro-btn-action" id="termometroBtn" onclick="toggleTermometro()">Ver Progreso</button>
        </div>
    </section>

    <script>
        (function() {
            const mercury = document.getElementById('mercuryElement');
            const kitsLabel = document.getElementById('kitsLabelElement');
            const container = document.getElementById('termometroMain');
            const btn = document.getElementById('termometroBtn');
            
            let isRevealed = false;

            window.toggleTermometro = function() {
                if (!isRevealed) {
                    container.classList.add('revealed');
                    btn.innerText = 'Ocultar';
                    setTimeout(() => { mercury.style.height = '55%'; }, 100);
                    setTimeout(() => { kitsLabel.innerHTML = `Kits<br>250 / 500`; }, 800);
                    isRevealed = true;
                } else {
                    container.classList.remove('revealed');
                    btn.innerText = 'Ver Progreso';
                    mercury.style.height = '0%';
                    kitsLabel.innerHTML = `???`;
                    isRevealed = false;
                }
            };
        })();
    </script>
